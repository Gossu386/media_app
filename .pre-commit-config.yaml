repos:
  - repo: local
    hooks:
      - id: update pre-commit-hooks
        name: Update Pre-Commit Hooks
        entry: pre-commit autoupdate
        language: system
        always_run: true
        pass_filenames: false

      - id: format-python
        name: Format Python Code with Ruff
        entry: bash src/scripts/pre-commit/format_code.sh
        language: system
        always_run: true
        pass_filenames: false
        
      - id: run-pytest
        name: Run Pytest
        entry: bash src/scripts/pre-commit/run_tests.sh
        language: system
        always_run: true
        pass_filenames: false